<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="color-scheme" content="light" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<title>Fila TOTTUS Machalí</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #ffffff; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 20px 16px 60px;
  }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 22px; font-weight: 800; color: #0a8a3f; letter-spacing: 0.5px; }
  header p { font-size: 15px; color: #666; margin-top: 6px; }
  .card {
    background: #f5f7f6;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid #e0e0e0;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    font-size: 16px;
  }
  .dot { width: 13px; height: 13px; border-radius: 50%; background: #666; flex-shrink: 0; }
  .dot.ok { background: #2ecc71; }
  .dot.bad { background: #e74c3c; }
  .dot.checking { background: #f1c40f; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  input[type="text"] {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid #ccc;
    background: #ffffff;
    color: #1a1a1a;
    font-size: 17px;
    margin-bottom: 14px;
  }
  input[type="text"]:disabled { opacity: 0.5; }

  button {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 13px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:active { opacity: 0.75; }
  button:disabled {
    background: #e8e8e8 !important;
    color: #999 !important;
    cursor: not-allowed;
  }
  .btn-primary { background: linear-gradient(135deg, #14a24f, #0a8a3f); color: #fff; }
  .btn-danger {
    background: #fdeeee;
    color: #c0392b;
    border: 1px solid #e0a5a5;
    padding: 14px;
    font-size: 15px;
    margin-top: 10px;
  }

  .queue-title {
    font-size: 17px;
    font-weight: 700;
    color: #333;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .queue-count {
    background: #0a8a3f;
    color: #fff;
    font-size: 14px;
    padding: 3px 11px;
    border-radius: 20px;
  }
  .queue-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 12px;
    border-radius: 12px;
    margin-bottom: 10px;
    background: #ffffff;
    border: 1px solid #e0e0e0;
  }
  .queue-item.mine { border-color: #0a8a3f88; background: #eefaf2; }
  .position {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #e8e8e8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 15px;
    flex-shrink: 0;
    color: #1a1a1a;
  }
  .position.first { background: #0a8a3f; color: #fff; }
  .queue-info { flex: 1; min-width: 0; }
  .queue-name { font-size: 16px; font-weight: 600; }
  .queue-time { font-size: 13px; color: #777; }
  .empty-msg { text-align: center; color: #999; padding: 30px 0; font-size: 15px; }
</style>
</head>
<body>

<header>
  <span style="font-size: 25px; font-weight: 800; color: #0a8a3f; letter-spacing: 0.5px; vertical-align: middle;">TOTTUS Machalí</span>
  <p>Fila de repartidores en tiempo real</p>
</header>

<div class="card">
  <div class="status-row">
    <div id="gpsDot" class="dot checking"></div>
    <span id="gpsText">Toca el botón para verificar tu ubicación</span>
  </div>

  <button id="checkBtn" class="btn-primary" style="margin-bottom:12px; background: linear-gradient(135deg, #2b7fd1, #1c5fa8);">📍 Verificar mi ubicación</button>

  <div id="welcomeBox" style="display:none; margin-bottom:14px;">
    <p style="font-size:17px; color:#333;">Hola, <strong id="welcomeName"></strong> 👋</p>
    <p style="font-size:14px; color:#888; margin-top:3px;">
      <a href="#" id="changeNameLink" style="color:#0a8a3f; text-decoration:underline;">¿No eres tú? Cambiar nombre</a>
    </p>
  </div>

  <input type="text" id="nameInput" placeholder="Escribe tu nombre" disabled />
  <button id="arriveBtn" class="btn-primary" disabled>Marcar llegada</button>
</div>

<div class="card">
  <div class="queue-title">
    <span>Fila actual</span>
    <span class="queue-count" id="queueCount">0</span>
  </div>
  <div id="queueList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBqryN_VtbtAPWjrcP3lsIqv14i8sxr53g",
    authDomain: "tottus-fila-repartidores.firebaseapp.com",
    databaseURL: "https://tottus-fila-repartidores-default-rtdb.firebaseio.com",
    projectId: "tottus-fila-repartidores",
    storageBucket: "tottus-fila-repartidores.firebasestorage.app",
    messagingSenderId: "1064720703867",
    appId: "1:1064720703867:web:204de4c0dd549c4a439dde",
    measurementId: "G-46D4MXHLB4"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const queueRef = db.ref("queue");
  const cooldownRef = db.ref("cooldown");

  // ---------- HORA REAL DEL SERVIDOR + LIMPIEZA DIARIA 9PM ----------
  let serverTimeOffset = 0;
  function getServerNow() {
    return new Date(Date.now() + serverTimeOffset);
  }

  function cleanOldEntries() {
    const now = getServerNow();
    const cutoff = new Date(now);
    cutoff.setHours(21, 0, 0, 0);
    if (now < cutoff) cutoff.setDate(cutoff.getDate() - 1);

    queueRef.once("value").then((snap) => {
      snap.forEach((child) => {
        const v = child.val() || {};
        if (!v.timestamp || v.timestamp < cutoff.getTime()) {
          child.ref.remove();
        }
      });
    });
  }

  db.ref(".info/serverTimeOffset").on("value", (snap) => {
    serverTimeOffset = snap.val() || 0;
    cleanOldEntries();
  });
  setInterval(cleanOldEntries, 5 * 60000);

  function safeKey(str) {
    return str.trim().toLowerCase().replace(/[.#$\[\]\/\s]+/g, "_");
  }

  // ---------- UBICACIÓN DEL SUPERMERCADO ----------
  const STORE_LAT = -34.1766919;
  const STORE_LNG = -70.6983408;
  const RADIUS_METERS = 150;

  // ---------- ELEMENTOS ----------
  const gpsDot = document.getElementById("gpsDot");
  const gpsText = document.getElementById("gpsText");
  const checkBtn = document.getElementById("checkBtn");
  const nameInput = document.getElementById("nameInput");
  const arriveBtn = document.getElementById("arriveBtn");
  const queueList = document.getElementById("queueList");
  const queueCount = document.getElementById("queueCount");
  const welcomeBox = document.getElementById("welcomeBox");
  const welcomeName = document.getElementById("welcomeName");
  const changeNameLink = document.getElementById("changeNameLink");

  let insideRadius = false;
  let watchStarted = false;
  let localCooldownInterval = null;
  let cooldownBlocking = false;

  function startLocalCooldownDisplay(untilTimestamp) {
    if (localCooldownInterval) clearInterval(localCooldownInterval);
    cooldownBlocking = true;
    function tick() {
      const timeOk = Date.now() >= untilTimestamp;
      if (timeOk) {
        clearInterval(localCooldownInterval);
        localCooldownInterval = null;
        localStorage.removeItem("tottus_local_cooldown_until");
        cooldownBlocking = false;
      }
    }
    tick();
    localCooldownInterval = setInterval(tick, 15000);
  }

  (function resumeLocalCooldownIfAny() {
    const until = parseInt(localStorage.getItem("tottus_local_cooldown_until") || "0", 10);
    if (until) { startLocalCooldownDisplay(until); }
  })();

  function getSavedName() {
    return localStorage.getItem("tottus_saved_name") || "";
  }
  function refreshNameUI() {
    const saved = getSavedName();
    if (saved) {
      welcomeBox.style.display = "block";
      welcomeName.textContent = saved;
      nameInput.style.display = "none";
    } else {
      welcomeBox.style.display = "none";
      nameInput.style.display = "block";
    }
  }
  refreshNameUI();

  changeNameLink.addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.removeItem("tottus_saved_name");
    nameInput.value = "";
    refreshNameUI();
  });

  function distanceMeters(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const toRad = (d) => (d * Math.PI) / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function checkLocation() {
    if (!navigator.geolocation) {
      gpsDot.className = "dot bad";
      gpsText.textContent = "Tu navegador no soporta GPS";
      return;
    }
    gpsDot.className = "dot checking";
    gpsText.textContent = "Verificando tu ubicación...";
    checkBtn.disabled = true;
    checkBtn.textContent = "Verificando...";

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        checkBtn.disabled = false;
        checkBtn.textContent = "📍 Verificar mi ubicación";
        const dist = distanceMeters(pos.coords.latitude, pos.coords.longitude, STORE_LAT, STORE_LNG);
        if (dist <= RADIUS_METERS) {
          insideRadius = true;
          gpsDot.className = "dot ok";
          gpsText.textContent = "Estás en el supermercado ✅";
          nameInput.disabled = false;
          arriveBtn.disabled = false;
        } else {
          insideRadius = false;
          gpsDot.className = "dot bad";
          gpsText.textContent = `Debes estar en el supermercado para marcar (a ${Math.round(dist)}m)`;
          nameInput.disabled = true;
          arriveBtn.disabled = true;
        }
        if (!watchStarted) {
          watchStarted = true;
          setInterval(checkLocation, 20000);
        }
      },
      (err) => {
        checkBtn.disabled = false;
        checkBtn.textContent = "📍 Verificar mi ubicación";
        gpsDot.className = "dot bad";
        if (err.code === 1) {
          gpsText.textContent = "Permiso denegado. Revisa Ajustes > Safari > Ubicación";
        } else {
          gpsText.textContent = "No se pudo obtener tu ubicación. Intenta de nuevo.";
        }
        nameInput.disabled = true;
        arriveBtn.disabled = true;
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }

  checkBtn.addEventListener("click", () => {
    if (cooldownBlocking) return;
    checkLocation();
  });

  arriveBtn.addEventListener("click", () => {
    const saved = getSavedName();
    const name = saved || nameInput.value.trim();
    if (!name) { alert("Escribe tu nombre primero"); return; }
    if (!insideRadius) { alert("Debes estar en el supermercado para marcar tu llegada"); return; }

    arriveBtn.disabled = true;
    arriveBtn.textContent = "Verificando...";
    const normalizedName = name.trim().toLowerCase();

    queueRef.once("value").then((queueSnap) => {
      const queueData = queueSnap.val() || {};
      const alreadyInQueue = Object.values(queueData).some(
        (v) => (v.name || "").trim().toLowerCase() === normalizedName
      );
      if (alreadyInQueue) {
        alert(`${name} ya tiene un registro activo en la fila. Debes salir primero (Salir a entregar / Ausentarme) antes de volver a marcar llegada.`);
        arriveBtn.disabled = false;
        arriveBtn.textContent = "Marcar llegada";
        return;
      }

      cooldownRef.child(safeKey(name)).once("value").then((snap) => {
        const lastExit = snap.val();
        const minutesPassed = lastExit ? (getServerNow().getTime() - lastExit) / 60000 : 999;
        if (lastExit && minutesPassed < 20) {
          const minutosFaltan = Math.ceil(20 - minutesPassed);
          alert(`Debes esperar ${minutosFaltan} minuto(s) más antes de volver a marcar llegada.`);
          arriveBtn.disabled = false;
          arriveBtn.textContent = "Marcar llegada";
          return;
        }

        arriveBtn.textContent = "Marcando...";
        const newRef = queueRef.push();
        newRef
          .set({ name: name, timestamp: firebase.database.ServerValue.TIMESTAMP })
          .then(() => {
            localStorage.setItem("tottus_my_entry", newRef.key);
            if (!saved) { localStorage.setItem("tottus_saved_name", name); }
            nameInput.value = "";
            refreshNameUI();
            arriveBtn.style.display = "none";
            checkBtn.disabled = true;
            checkBtn.style.opacity = "0.5";
            renderQueue(lastEntries);
          })
          .catch((err) => {
            alert("Error al marcar llegada: " + err.message);
            arriveBtn.disabled = false;
            arriveBtn.textContent = "Marcar llegada";
          });
      }).catch((err) => {
        alert("Error al verificar cooldown: " + err.message);
        arriveBtn.disabled = false;
        arriveBtn.textContent = "Marcar llegada";
      });
    }).catch((err) => {
      alert("Error al verificar la fila: " + err.message);
      arriveBtn.disabled = false;
      arriveBtn.textContent = "Marcar llegada";
    });
  });

  let lastEntries = [];

  function renderQueue(entries) {
    queueCount.textContent = entries.length;
    queueList.innerHTML = "";

    let myKey = localStorage.getItem("tottus_my_entry");
    const savedName = getSavedName();

    if (savedName) {
      const normalizedSaved = savedName.trim().toLowerCase();
      const matchByName = entries.find((e) => (e.name || "").trim().toLowerCase() === normalizedSaved);
      if (matchByName && matchByName.key !== myKey) {
        myKey = matchByName.key;
        localStorage.setItem("tottus_my_entry", myKey);
      }
    }

    const stillInQueue = entries.some((e) => e.key === myKey);
    if (myKey && !stillInQueue) {
      localStorage.removeItem("tottus_my_entry");
      refreshNameUI();
      nameInput.disabled = !insideRadius || !!getSavedName();
      arriveBtn.style.display = "block";
      arriveBtn.disabled = !insideRadius;
      arriveBtn.textContent = "Marcar llegada";
      checkBtn.disabled = false;
      checkBtn.style.opacity = "1";
    } else if (myKey && stillInQueue) {
      arriveBtn.style.display = "none";
      checkBtn.disabled = true;
      checkBtn.style.opacity = "0.5";
    }

    if (entries.length === 0) {
      queueList.innerHTML = '<div class="empty-msg">No hay nadie en la fila todavía</div>';
      return;
    }

    entries.forEach((entry, idx) => {
      const isMine = entry.key === myKey;
      const time = new Date(entry.timestamp).toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });

      const item = document.createElement("div");
      item.className = "queue-item" + (isMine ? " mine" : "");
      item.innerHTML = `
        <div class="position ${idx === 0 ? "first" : ""}">${idx + 1}</div>
        <div class="queue-info">
          <div class="queue-name">${entry.name}${isMine ? " (tú)" : ""}</div>
          <div class="queue-time">Llegó a las ${time}</div>
        </div>
      `;

      if (isMine) {
        const btn1 = document.createElement("button");
        btn1.className = "btn-danger";
        btn1.textContent = "✅ Salir a entregar";
        btn1.style.width = "100%";
        btn1.style.marginTop = "10px";
        btn1.onclick = () => {
          if (confirm("¿Confirmas que recibiste tus pedidos y sales de la fila?")) {
            localStorage.removeItem("tottus_my_entry");
            localStorage.removeItem("tottus_must_leave");
            queueRef.child(entry.key).remove();
            cooldownRef.child(safeKey(entry.name)).set(firebase.database.ServerValue.TIMESTAMP);
            arriveBtn.style.display = "block";
            arriveBtn.disabled = true;
            arriveBtn.textContent = "Marcar llegada";
            checkBtn.disabled = false;
            checkBtn.style.opacity = "1";
            gpsDot.className = "dot checking";
            gpsText.textContent = "Toca el botón para verificar tu ubicación";
            const until = Date.now() + 20 * 60000;
            localStorage.setItem("tottus_local_cooldown_until", String(until));
            startLocalCooldownDisplay(until);
            renderQueue(lastEntries.filter((e) => e.key !== entry.key));
          }
        };

        const btn2 = document.createElement("button");
        btn2.className = "btn-danger";
        btn2.textContent = "⏸️ Ausentarme";
        btn2.style.width = "100%";
        btn2.style.marginTop = "8px";
        btn2.style.background = "#fff8ea";
        btn2.style.color = "#a6740a";
        btn2.style.borderColor = "#e0c98a";
        if (entry.assigned) {
          btn2.disabled = true;
          btn2.style.opacity = "0.4";
          btn2.style.cursor = "not-allowed";
        }
        btn2.onclick = () => {
          if (entry.assigned) return;
          if (confirm("¿Confirmas que quieres salir de la fila temporalmente? Cuando vuelvas deberás escribir tu nombre y marcar llegada de nuevo.")) {
            localStorage.removeItem("tottus_my_entry");
            localStorage.removeItem("tottus_saved_name");
            queueRef.child(entry.key).remove();
            nameInput.value = "";
            refreshNameUI();
            arriveBtn.style.display = "block";
            arriveBtn.disabled = !insideRadius;
            arriveBtn.textContent = "Marcar llegada";
            checkBtn.disabled = false;
            checkBtn.style.opacity = "1";
            renderQueue(lastEntries.filter((e) => e.key !== entry.key));
          }
        };

        const topRow = document.createElement("div");
        topRow.style.display = "flex";
        topRow.style.alignItems = "center";
        topRow.style.gap = "12px";
        topRow.innerHTML = item.innerHTML;
        item.innerHTML = "";
        item.style.flexDirection = "column";
        item.style.alignItems = "stretch";
        item.appendChild(topRow);

        if (entry.assigned) {
          const banner = document.createElement("div");
          banner.textContent = "✅ Ya puedes salir a entregar";
          banner.style.background = "#0a8a3f";
          banner.style.color = "#fff";
          banner.style.fontWeight = "700";
          banner.style.textAlign = "center";
          banner.style.padding = "12px";
          banner.style.borderRadius = "10px";
          banner.style.marginTop = "10px";
          banner.style.fontSize = "16px";
          item.appendChild(banner);
        }

        item.appendChild(btn1);
        item.appendChild(btn2);
      }

      queueList.appendChild(item);
    });
  }

  queueRef.on("value", (snapshot) => {
    const data = snapshot.val() || {};
    const entries = Object.entries(data).map(([key, val]) => ({
      key,
      name: val.name,
      timestamp: val.timestamp || 0,
      assigned: !!val.assigned,
    }));
    entries.sort((a, b) => a.timestamp - b.timestamp);
    lastEntries = entries;
    renderQueue(entries);
  });
</script>

</body>
</html>
