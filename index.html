<title>Fila TOTTUS Machalí</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html {
    background: #ffffff;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 20px 16px 60px;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header h1 {
    font-size: 22px;
    font-weight: 800;
    color: #0a8a3f;
    letter-spacing: 0.5px;
  }
  header p {
    font-size: 15px;
    color: #666;
    margin-top: 6px;
  }
  .card {
    background: #f5f7f6;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid #e0e0e0;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    font-size: 16px;
  }
  .dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #666;
    flex-shrink: 0;
  }
  .dot.ok { background: #2ecc71; }
  .dot.bad { background: #e74c3c; }
  .dot.checking { background: #f1c40f; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  input[type="text"] {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid #ccc;
    background: #ffffff;
    color: #1a1a1a;
    font-size: 17px;
    margin-bottom: 14px;
  }
  input[type="text"]:disabled { opacity: 0.5; }

  button {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 13px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:active { opacity: 0.75; }
  button:disabled {
    background: #e8e8e8 !important;
    color: #999 !important;
    cursor: not-allowed;
  }
  .btn-primary {
    background: linear-gradient(135deg, #14a24f, #0a8a3f);
    color: #fff;
  }
  .btn-danger {
    background: #fdeeee;
    color: #c0392b;
    border: 1px solid #e0a5a5;
    padding: 14px;
    font-size: 15px;
    margin-top: 10px;
  }

  .queue-title {
    font-size: 17px;
    font-weight: 700;
    color: #333;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .queue-count {
    background: #0a8a3f;
    color: #fff;
    font-size: 14px;
    padding: 3px 11px;
    border-radius: 20px;
  }
  .queue-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 12px;
    border-radius: 12px;
    margin-bottom: 10px;
    background: #ffffff;
    border: 1px solid #e0e0e0;
  }
  .queue-item.mine {
    border-color: #0a8a3f88;
    background: #eefaf2;
  }
  .position {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #e8e8e8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 15px;
    flex-shrink: 0;
    color: #1a1a1a;
  }
  .position.first { background: #0a8a3f; color: #fff; }
  .queue-info { flex: 1; min-width: 0; }
  .queue-name { font-size: 16px; font-weight: 600; }
  .queue-time { font-size: 13px; color: #777; }
  .empty-msg {
    text-align: center;
    color: #999;
    padding: 30px 0;
    font-size: 15px;
  }
</style>
</head>

<script>
  // ---------- CONFIGURACIÓN FIREBASE ----------
  const firebaseConfig = {
    apiKey: "AIzaSyBqryN_VtbtAPWjrcP3lsIqv14i8sxr53g",
    authDomain: "tottus-fila-repartidores.firebaseapp.com",
    databaseURL: "https://tottus-fila-repartidores-default-rtdb.firebaseio.com",
    projectId: "tottus-fila-repartidores",
    storageBucket: "tottus-fila-repartidores.firebasestorage.app",
    messagingSenderId: "1064720703867",
    appId: "1:1064720703867:web:204de4c0dd549c4a439dde",
    measurementId: "G-46D4MXHLB4"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const queueRef = db.ref("queue");

  // ---------- UBICACIÓN DEL SUPERMERCADO ----------
  const STORE_LAT = -34.1766919;
  const STORE_LNG = -70.6983408;
  const RADIUS_METERS = 50; // margen de tolerancia GPS

  // ---------- ELEMENTOS ----------
  const gpsDot = document.getElementById("gpsDot");
  const gpsText = document.getElementById("gpsText");
  const checkBtn = document.getElementById("checkBtn");
  const nameInput = document.getElementById("nameInput");
  const arriveBtn = document.getElementById("arriveBtn");
  const queueList = document.getElementById("queueList");
  const queueCount = document.getElementById("queueCount");
  const welcomeBox = document.getElementById("welcomeBox");
  const welcomeName = document.getElementById("welcomeName");
  const changeNameLink = document.getElementById("changeNameLink");

  let insideRadius = false;
  let watchStarted = false;

  // ---------- NOMBRE GUARDADO (se pide una sola vez) ----------
  function getSavedName() {
    return localStorage.getItem("tottus_saved_name") || "";
  }
  function refreshNameUI() {
    const saved = getSavedName();
    if (saved) {
      welcomeBox.style.display = "block";
      welcomeName.textContent = saved;
      nameInput.style.display = "none";
    } else {
      welcomeBox.style.display = "none";
      nameInput.style.display = "block";
    }
  }
  refreshNameUI();

  changeNameLink.addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.removeItem("tottus_saved_name");
    nameInput.value = "";
    refreshNameUI();
  });
  const myEntryKey = localStorage.getItem("tottus_my_entry") || null;

  // ---------- CALCULAR DISTANCIA (Haversine) ----------
  function distanceMeters(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const toRad = (d) => (d * Math.PI) / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  // ---------- VERIFICAR GPS ----------
  function checkLocation() {
    if (!navigator.geolocation) {
      gpsDot.className = "dot bad";
      gpsText.textContent = "Tu navegador no soporta GPS";
      return;
    }
    gpsDot.className = "dot checking";
    gpsText.textContent = "Verificando tu ubicación...";
    checkBtn.disabled = true;
    checkBtn.textContent = "Verificando...";

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        checkBtn.disabled = false;
        checkBtn.textContent = "📍 Verificar mi ubicación";
        const dist = distanceMeters(
          pos.coords.latitude,
          pos.coords.longitude,
          STORE_LAT,
          STORE_LNG
        );
        if (dist <= RADIUS_METERS) {
          insideRadius = true;
          gpsDot.className = "dot ok";
          gpsText.textContent = "Estás en el supermercado ✅";
          nameInput.disabled = false;
          arriveBtn.disabled = false;
        } else {
          insideRadius = false;
          gpsDot.className = "dot bad";
          gpsText.textContent = `Debes estar en el supermercado para marcar (a ${Math.round(dist)}m)`;
          nameInput.disabled = true;
          arriveBtn.disabled = true;
        }
        if (!watchStarted) {
          watchStarted = true;
          setInterval(checkLocation, 20000);
        }
      },
      (err) => {
        checkBtn.disabled = false;
        checkBtn.textContent = "📍 Verificar mi ubicación";
        gpsDot.className = "dot bad";
        if (err.code === 1) {
          gpsText.textContent = "Permiso denegado. Revisa Ajustes > Safari > Ubicación";
        } else {
          gpsText.textContent = "No se pudo obtener tu ubicación. Intenta de nuevo.";
        }
        nameInput.disabled = true;
        arriveBtn.disabled = true;
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }

  checkBtn.addEventListener("click", checkLocation);

  // ---------- MARCAR LLEGADA ----------
  arriveBtn.addEventListener("click", () => {
    const saved = getSavedName();
    const name = saved || nameInput.value.trim();
    if (!name) {
      alert("Escribe tu nombre primero");
      return;
    }
    if (!insideRadius) {
      alert("Debes estar en el supermercado para marcar tu llegada");
      return;
    }
    arriveBtn.disabled = true;
    arriveBtn.textContent = "Marcando...";

    const newRef = queueRef.push();
    newRef
      .set({
        name: name,
        timestamp: firebase.database.ServerValue.TIMESTAMP,
      })
      .then(() => {
        localStorage.setItem("tottus_my_entry", newRef.key);
        if (!saved) {
          localStorage.setItem("tottus_saved_name", name);
        }
        nameInput.value = "";
        refreshNameUI();
        arriveBtn.style.display = "none";
      })
      .catch((err) => {
        alert("Error al marcar llegada: " + err.message);
        arriveBtn.disabled = false;
        arriveBtn.textContent = "Marcar llegada";
      });
  });

  // ---------- ESCUCHAR FILA EN TIEMPO REAL ----------
  queueRef.on("value", (snapshot) => {
    const data = snapshot.val() || {};
    const entries = Object.entries(data).map(([key, val]) => ({
      key,
      name: val.name,
      timestamp: val.timestamp || 0,
    }));
    entries.sort((a, b) => a.timestamp - b.timestamp);

    queueCount.textContent = entries.length;
    queueList.innerHTML = "";

    const myKey = localStorage.getItem("tottus_my_entry");

    // Si mi entrada ya no existe en la lista (fue borrada), reactivar formulario
    const stillInQueue = entries.some((e) => e.key === myKey);
    if (myKey && !stillInQueue) {
      localStorage.removeItem("tottus_my_entry");
      refreshNameUI();
      nameInput.disabled = !insideRadius || !!getSavedName();
      arriveBtn.style.display = "block";
      arriveBtn.disabled = !insideRadius;
      arriveBtn.textContent = "Marcar llegada";
    }

    if (entries.length === 0) {
      queueList.innerHTML = '<div class="empty-msg">No hay nadie en la fila todavía</div>';
      return;
    }

    entries.forEach((entry, idx) => {
      const isMine = entry.key === myKey;
      const time = new Date(entry.timestamp).toLocaleTimeString("es-CL", {
        hour: "2-digit",
        minute: "2-digit",
      });

      const item = document.createElement("div");
      item.className = "queue-item" + (isMine ? " mine" : "");
      item.innerHTML = `
        <div class="position ${idx === 0 ? "first" : ""}">${idx + 1}</div>
        <div class="queue-info">
          <div class="queue-name">${entry.name}${isMine ? " (tú)" : ""}</div>
          <div class="queue-time">Llegó a las ${time}</div>
        </div>
      `;

      if (isMine) {
        const btn1 = document.createElement("button");
        btn1.className = "btn-danger";
        btn1.textContent = "✅ Ya recibí mis pedidos";
        btn1.style.width = "100%";
        btn1.style.marginTop = "10px";
        btn1.onclick = () => {
          if (confirm("¿Confirmas que recibiste tus pedidos y sales de la fila?")) {
            queueRef.child(entry.key).remove();
          }
        };

        const btn2 = document.createElement("button");
        btn2.className = "btn-danger";
        btn2.textContent = "⏸️ Ausentarme un momento";
        btn2.style.width = "100%";
        btn2.style.marginTop = "8px";
        btn2.style.background = "#fff8ea";
        btn2.style.color = "#a6740a";
        btn2.style.borderColor = "#e0c98a";
        btn2.onclick = () => {
          if (confirm("¿Confirmas que quieres salir de la fila temporalmente? Cuando vuelvas deberás marcar llegada de nuevo.")) {
            queueRef.child(entry.key).remove();
          }
        };

        const wrapper = document.createElement("div");
        wrapper.style.width = "100%";
        item.style.flexDirection = "column";
        item.style.alignItems = "stretch";
        const topRow = document.createElement("div");
        topRow.style.display = "flex";
        topRow.style.alignItems = "center";
        topRow.style.gap = "12px";
        topRow.innerHTML = item.innerHTML;
        item.innerHTML = "";
        item.appendChild(topRow);
        item.appendChild(btn1);
        item.appendChild(btn2);
      }

      queueList.appendChild(item);
    });
  });
</script>

</body>
</html>
