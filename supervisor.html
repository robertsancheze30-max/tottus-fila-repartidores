<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="color-scheme" content="light" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<title>Supervisor - Fila TOTTUS Machalí</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #ffffff; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #ffffff;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 20px 16px 60px;
  }
  header { text-align: center; margin-bottom: 24px; }
  header p { font-size: 15px; color: #666; margin-top: 6px; }
  .badge {
    display: inline-block;
    background: #0a8a3f;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    margin-top: 8px;
    letter-spacing: 0.5px;
  }
  .card {
    background: #f5f7f6;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid #e0e0e0;
  }
  .queue-title {
    font-size: 17px;
    font-weight: 700;
    color: #333;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .queue-count {
    background: #0a8a3f;
    color: #fff;
    font-size: 14px;
    padding: 3px 11px;
    border-radius: 20px;
  }
  .queue-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 12px;
    border-radius: 12px;
    margin-bottom: 10px;
    background: #ffffff;
    border: 1px solid #e0e0e0;
  }
  .queue-item.assigned {
    background: #eefaf2;
    border-color: #0a8a3f66;
  }
  .check-wrap {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    position: relative;
    cursor: pointer;
  }
  .check-wrap input[type="checkbox"] {
    position: absolute;
    width: 42px;
    height: 42px;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .check-box {
    font-size: 22px;
    opacity: 0.25;
    filter: grayscale(1);
    transition: opacity 0.15s, filter 0.15s;
  }
  .check-wrap input[type="checkbox"]:checked + .check-box {
    opacity: 1;
    filter: grayscale(0);
  }
  .position {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #e8e8e8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 15px;
    flex-shrink: 0;
    color: #1a1a1a;
  }
  .position.first { background: #0a8a3f; color: #fff; }
  .queue-info { flex: 1; min-width: 0; }
  .queue-name { font-size: 16px; font-weight: 600; }
  .queue-time { font-size: 13px; color: #777; }
  .empty-msg {
    text-align: center;
    color: #999;
    padding: 30px 0;
    font-size: 15px;
  }
  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #0a8a3f;
    display: inline-block;
    margin-right: 6px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .live-row {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-top: 18px;
  }
</style>
</head>
<body>

<header>
  <span style="font-size: 25px; font-weight: 800; color: #0a8a3f; letter-spacing: 0.5px; vertical-align: middle;">TOTTUS Machalí</span>
  <p>Fila de repartidores en tiempo real</p>
  <div class="badge">VISTA PICKERS</div>
</header>

<div class="card">
  <div class="queue-title">
    <span>Fila actual</span>
    <span class="queue-count" id="queueCount">0</span>
  </div>
  <div id="queueList"></div>
</div>

<div class="live-row"><span class="live-dot"></span>Actualizando en tiempo real</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBqryN_VtbtAPWjrcP3lsIqv14i8sxr53g",
    authDomain: "tottus-fila-repartidores.firebaseapp.com",
    databaseURL: "https://tottus-fila-repartidores-default-rtdb.firebaseio.com",
    projectId: "tottus-fila-repartidores",
    storageBucket: "tottus-fila-repartidores.firebasestorage.app",
    messagingSenderId: "1064720703867",
    appId: "1:1064720703867:web:204de4c0dd549c4a439dde",
    measurementId: "G-46D4MXHLB4"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const queueRef = db.ref("queue");
  const metaRef = db.ref("meta");

  function getTodayDateString() {
    const now = new Date();
    return `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
  }

  function checkAutoReset() {
    const now = new Date();
    if (now.getHours() < 21) return;

    const today = getTodayDateString();
    metaRef.child("lastResetDate").once("value").then((snap) => {
      const lastReset = snap.val();
      if (lastReset !== today) {
        queueRef.remove();
        metaRef.child("lastResetDate").set(today);
      }
    });
  }

  checkAutoReset();
  setInterval(checkAutoReset, 5 * 60000);

  const queueList = document.getElementById("queueList");
  const queueCount = document.getElementById("queueCount");

  queueRef.on("value", (snapshot) => {
    const data = snapshot.val() || {};
    const entries = Object.entries(data).map(([key, val]) => ({
      key,
      name: val.name,
      timestamp: val.timestamp || 0,
      assigned: !!val.assigned,
    }));
    entries.sort((a, b) => a.timestamp - b.timestamp);

    queueCount.textContent = entries.length;
    queueList.innerHTML = "";

    if (entries.length === 0) {
      queueList.innerHTML = '<div class="empty-msg">No hay nadie en la fila todavía</div>';
      return;
    }

    entries.forEach((entry, idx) => {
      const time = new Date(entry.timestamp).toLocaleTimeString("es-CL", {
        hour: "2-digit",
        minute: "2-digit",
      });

      const item = document.createElement("div");
      item.className = "queue-item" + (entry.assigned ? " assigned" : "");
      item.innerHTML = `
        <div class="position ${idx === 0 ? "first" : ""}">${idx + 1}</div>
        <div class="queue-info">
          <div class="queue-name">${entry.name}</div>
          <div class="queue-time">Llegó a las ${time}</div>
        </div>
        <label class="check-wrap">
          <input type="checkbox" class="assign-check" data-key="${entry.key}" ${entry.assigned ? "checked" : ""} />
          <span class="check-box">✅</span>
        </label>
      `;
      queueList.appendChild(item);
    });

    // Conectar cada checkbox a Firebase, verificando primero que el nodo siga existiendo
    document.querySelectorAll(".assign-check").forEach((box) => {
      box.addEventListener("change", (e) => {
        const key = e.target.getAttribute("data-key");
        const checked = e.target.checked;
        e.target.disabled = true;
        queueRef.child(key).once("value").then((snap) => {
          if (snap.exists()) {
            queueRef.child(key).update({ assigned: checked }).finally(() => {
              e.target.disabled = false;
            });
          } else {
            // El repartidor ya salió de la fila antes de que se aplicara el cambio
            e.target.checked = !checked;
            e.target.disabled = false;
          }
        });
      });
    });
  });
</script>

</body>
</html>
